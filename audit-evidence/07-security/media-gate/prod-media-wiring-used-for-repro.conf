# Verbatim copy of production media-auth wiring (conf.d/kgkg-mediaauth.conf +
# the two locations of sites-available/kgkg), ports pointed at the QA backend.
proxy_cache_path /tmp/kg_mediaauth levels=1 keys_zone=kg_mediaauth:5m max_size=50m inactive=10m;
map $request_uri $kg_media_car {
    ~^/kg-api/media/(?<car>[^/?]+)/ $car;
    default "";
}
server {
    listen 127.0.0.1:8140;
    location = /_kg_media_auth {
        internal;
        proxy_pass http://127.0.0.1:8120/api/media-auth/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_cache kg_mediaauth;
        proxy_cache_key "$cookie_kg_portal_token|$http_authorization|$kg_media_car";
        proxy_cache_valid 204 401 403 60s;
    }
    location ^~ /kg-api/media/ {
        alias "/opt/KGKG/KG_backend/static_warehouse/";
        auth_request /_kg_media_auth;
        add_header Cache-Control "private, max-age=2592000, immutable";
        try_files $uri $uri/index.html /index.html =404;
    }
}
