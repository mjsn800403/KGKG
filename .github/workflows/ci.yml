name: ci

# Same checks as the server-side deploy gate (ops/deploy/gate.sh), on every
# branch and pull request, plus the supply-chain and security gates that only
# make sense centrally (ops/security/README.md). Production deploys happen on
# the server through ops/deploy/deploy.sh, which re-runs the gate on the exact
# commit; nothing here can promote to production.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: no job here writes to the repository.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: KG_backend
    env:
      DJANGO_DEBUG: "true"
      KG_ADMIN_TOKEN: ci-dummy-token
      KG_ENV_FILE: /tmp/ci-dummy.env
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      KG_WARMUP: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries (WeasyPrint PDF reports)
        run: sudo apt-get update -q && sudo apt-get install -yq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - name: Install dependencies
        # torch is installed CPU-only; the RAG tests stub the embedding model.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "Django>=4.2,<6" "django-cors-headers>=4.0" "beautifulsoup4>=4.12" "html5lib>=1.1" \
                      "numpy>=1.26,<2" "sqlite-vec>=0.1.6" "sentence-transformers>=2.7" "sentry-sdk>=2.0,<3" \
                      "cryptography>=42" weasyprint pillow requests coverage unittest-xml-reporting
      - name: Django system check
        run: python manage.py check
      - name: Migrations match models
        run: python manage.py makemigrations --check --dry-run
      - name: Full test suite (with coverage)
        # Branch coverage of application code only: every test module
        # (test_*.py, tests.py, tests_parts.py) and migrations are excluded,
        # so the figure cannot be inflated by tests covering themselves.
        # JUnit XML goes to test-reports/ for the published results.
        run: |
          coverage run --branch --source=api --omit='*/test_*,*/tests.py,*/tests_*.py,*/migrations/*' \
            manage.py test --noinput --testrunner xmlrunner.extra.djangotestrunner.XMLTestRunner
      - name: Coverage ratchet (ops/deploy/coverage_min)
        # A floor, not a target: it may only ever move up. Raise the file in the
        # same commit that adds the tests, never lower it to make CI pass.
        run: |
          MIN=$(cat ../ops/deploy/coverage_min)
          echo "coverage floor: ${MIN}%"
          coverage report --skip-covered --sort=cover | tail -25
          coverage report --fail-under="$MIN" >/dev/null
      - name: Coverage summary
        if: always()
        run: |
          total=$(coverage report --format=total)
          echo "total coverage (line+branch): ${total}% (floor $(cat ../ops/deploy/coverage_min)%)" >> "$GITHUB_STEP_SUMMARY"
          coverage xml -o coverage.xml
          coverage html -d coverage-html
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for f in glob.glob('test-reports/*.xml'):
              r = ET.parse(f).getroot()
              for s in ([r] if r.tag == 'testsuite' else r.iter('testsuite')):
                  for k in t:
                      t[k] += int(s.get(k, 0))
          print(f"tests: {t['tests']}, failures: {t['failures']}, errors: {t['errors']}, skipped: {t['skipped']}")
          PY

      - name: Publish test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.sha }}
          path: |
            KG_backend/test-reports/
            KG_backend/coverage.xml
            KG_backend/coverage-html/
          retention-days: 90

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kg_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kg_frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint (ratchet, see ops/deploy/lint_max_warnings)
        run: npx eslint src --max-warnings "$(cat ../ops/deploy/lint_max_warnings)"
      - name: Unit tests (node:test, with coverage)
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: /kg-api

  security:
    # Supply chain and secrets. Fails closed: an advisory with a fix available
    # is a bug to fix, not a number to accept. Exceptions live in
    # ops/security/ and each carries a review date.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks scans the pushed commits too

      - name: Shell lint (ops/)
        # -x follows sourced files; ops/deploy/kg-deploy-gate has no .sh suffix
        # but is the most security-sensitive script in the repository.
        run: |
          mapfile -t files < <(git ls-files 'ops/**/*.sh' 'ops/*.sh' 'qa/*.sh' 'qa/**/*.sh')
          files+=(ops/deploy/kg-deploy-gate)
          printf 'checking %s\n' "${files[@]}"
          shellcheck -S warning -x "${files[@]}"

      - name: Operations tests (deploy gate, watchdog, staging sanitizer)
        # The gate decides whether a key may promote to production, the
        # watchdog is the last thing that would page if alerting died, and the
        # sanitizer is what keeps real credentials off staging. All three are
        # standard-library only and run in seconds, so there is no excuse for
        # them not to be tested on every push.
        run: |
          bash ops/deploy/test_gate_roles.sh
          python3 -m unittest discover -s ops/observability -t ops/observability -p 'test_*.py' -v
          python3 ops/deploy/sanitize_staging_db.py --selftest
          python3 ops/observability/watchdog.py --selftest

      - name: Dockerfile lint
        run: |
          for f in ops/docker/*.Dockerfile; do
            echo "== $f"
            docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" \
              hadolint/hadolint:v2.12.0 hadolint --no-color - < "$f"
          done

      - name: Secret scan
        # --no-git (filesystem scan of the checkout) is deliberate: gitleaks in
        # git mode exits 0 when it cannot read the repository, which would turn
        # a broken gate into a silent pass. The filesystem scan either reads
        # the tree or fails loudly. The report file is then asserted to exist,
        # so a crash cannot be mistaken for a clean result.
        run: |
          docker run --rm -v "$PWD":/repo:ro -v /tmp:/out \
            zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --no-git --config=/repo/.gitleaks.toml \
                   --redact --no-banner --report-format json --report-path /out/leaks.json
          test -f /tmp/leaks.json || { echo "gitleaks produced no report — treating as failure"; exit 1; }
          count=$(python3 -c 'import json;print(len(json.load(open("/tmp/leaks.json"))))')
          echo "secret scan: $count finding(s)"
          test "$count" = "0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static application security testing (bandit)
        # Medium and high severity only. Every finding present when the gate
        # was introduced was triaged (ops/security/README.md#bandit) and is
        # recorded in bandit-baseline.json; any finding not in it fails.
        run: |
          pip install --quiet bandit==1.9.4
          bandit -r KG_backend/api KG_backend/KG_backend \
            -x '*/test_*,*/tests.py,*/tests_parts.py,*/migrations/*' \
            -ll -b ops/security/bandit-baseline.json

      - name: QA suites parse (E2E, load)
        run: |
          for f in qa/e2e/playwright.config.js qa/e2e/tests/*.js qa/perf/*.js; do
            node --check "$f" 2>/dev/null || node --input-type=module --check < "$f"
          done

      - name: Python dependency audit
        run: |
          pip install --quiet pip-audit==2.9.0
          # The lock pins torch to a +cpu local version that exists only on
          # PyTorch's index; strip the local label so the advisory database can
          # be queried by base version.
          sed 's/+cpu$//' ops/docker/backend-requirements.lock > /tmp/lock-audit.txt
          mapfile -t ignores < <(grep -vE '^\s*(#|$)' ops/security/pip-audit-ignore.txt | sed 's/^/--ignore-vuln=/')
          echo "ignoring ${#ignores[@]} reviewed advisory id(s)"
          pip-audit --no-deps -r /tmp/lock-audit.txt "${ignores[@]}"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Node dependency audit
        run: node ops/security/npm_audit_gate.mjs

  images:
    # The production images (ops/docker/) must build from every commit, boot,
    # and carry no fixable HIGH/CRITICAL vulnerability.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Backend image
        run: docker build -f ops/docker/backend.Dockerfile -t kgkg-backend:ci .
      - name: Frontend image
        run: docker build -f ops/docker/frontend.Dockerfile -t kgkg-frontend:ci .
      - name: Backend image boots (Django check)
        run: docker run --rm -e DJANGO_DEBUG=true -e KG_ADMIN_TOKEN=ci -e KG_ENV_FILE=/tmp/x.env kgkg-backend:ci python manage.py check

      - name: Scan both images for vulnerabilities
        # --ignore-unfixed: an advisory with no released fix is not actionable
        # at build time; it is tracked in ops/security/README.md instead.
        # Exceptions in .trivyignore.yaml expire on a date trivy enforces.
        run: |
          for img in kgkg-backend:ci kgkg-frontend:ci; do
            echo "== $img"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" \
              -v trivy-cache:/root/.cache/trivy \
              aquasec/trivy:0.58.1 image \
                --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
                --ignorefile /.trivyignore.yaml \
                --exit-code 1 --no-progress "$img"
          done

  stage:
    # Push to `work`, everything green -> stage that exact commit on the
    # server: gate in a clean worktree, build both images, run them against a
    # sanitized copy of the production database, smoke the signed-in paths.
    #
    # This job CANNOT reach production. The key in DEPLOY_SSH_KEY is pinned on
    # the server to /usr/local/bin/kg-ci-gate, whose role has no `deploy`
    # verb (ops/deploy/kg-deploy-gate, matrix tested by
    # ops/deploy/test_gate_roles.sh). A leaked secret buys a staging run.
    # Promotion is `kgkg-promote <sha>`, typed by a person on the host.
    if: github.event_name == 'push' && github.ref == 'refs/heads/work'
    needs: [backend, frontend, security, images]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: kgkg-staging
      cancel-in-progress: false
    steps:
      - name: Check the staging credential is configured
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          missing=
          [ -n "$KEY" ]  || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$HOST" ] || missing="$missing DEPLOY_HOST"
          if [ -n "$missing" ]; then
            echo "::error::Staging cannot run: missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "The key must be the one pinned to kg-ci-gate in the server's authorized_keys."
            exit 1
          fi

      - name: Stage ${{ github.sha }}
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SHA: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            strict=yes
          else
            # Without a pinned host key the connection is not authenticated in
            # the server's direction, so say so loudly rather than pretend.
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set; the server's host key is not verified."
            strict=accept-new
          fi
          ssh -i ~/.ssh/deploy -o "StrictHostKeyChecking=$strict" \
              -o ServerAliveInterval=30 -o ConnectTimeout=20 \
              "root@$HOST" "stage $SHA"

      - name: What the server reports
        if: always()
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          [ -n "$KEY" ] || exit 0
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 "root@$HOST" "status" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
