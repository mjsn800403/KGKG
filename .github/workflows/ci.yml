name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KG_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Django checks, migration drift, tests
        env:
          DJANGO_SECRET_KEY: ci-dummy-key-not-secret
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        run: |
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run
          python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kg_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kg_frontend/package-lock.json
      - run: npm ci
      # Pre-existing lint debt is reported but non-blocking; the build is the hard gate.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t kg-backend ./KG_backend
      - name: Build frontend image
        run: docker build -t kg-frontend --build-arg NEXT_PUBLIC_API_BASE=http://localhost:8000 ./kg_frontend

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
