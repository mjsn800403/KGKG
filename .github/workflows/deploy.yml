name: deploy

# Push to `work` -> ci passes -> this job asks the server to deploy that exact
# commit. The server runs the full pipeline itself (ops/deploy/deploy.sh:
# gate -> staging -> promote -> smoke, auto-rollback on failure).
#
# The SSH key in DEPLOY_SSH_KEY is pinned on the server to a forced command
# (/usr/local/bin/kg-deploy-gate) that only accepts `deploy <sha>` for a
# commit already on origin/work; it cannot open a shell. Approval: add
# required reviewers to the `production` environment in the repo settings.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [work]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - name: Deploy ${{ github.event.workflow_run.head_sha }}
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
              "root@$HOST" "deploy $SHA"
