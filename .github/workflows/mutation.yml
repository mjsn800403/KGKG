name: mutation

# Mutation testing of the authorization modules (qa/mutation/run.sh). Run on
# demand, e.g. before a release that touches access rules: it takes about an
# hour, so it is not part of every push. Results are uploaded as an artifact
# and summarised on the run page; copy them into
# audit-evidence/03-unit-testing/mutation/ when they are release evidence.
on:
  workflow_dispatch:
    inputs:
      modules:
        description: "space-separated modules under KG_backend/api (default: admin_auth mediaauth access)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries (WeasyPrint PDF reports)
        run: sudo apt-get update -q && sudo apt-get install -yq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "Django>=4.2,<6" "django-cors-headers>=4.0" "beautifulsoup4>=4.12" "html5lib>=1.1" \
                      "numpy>=1.26,<2" "sqlite-vec>=0.1.6" "sentence-transformers>=2.7" "sentry-sdk>=2.0,<3" \
                      "cryptography>=42" weasyprint pillow requests "mutmut==2.4.5"
      - name: Mutation testing
        env:
          MODULES: ${{ inputs.modules }}
        run: |
          # word-splitting of MODULES is intended: one argument per module
          # shellcheck disable=SC2086
          OUT="$PWD/mutation-results" bash qa/mutation/run.sh $MODULES
          { echo '### Mutation score'; echo '```'; cat mutation-results/summary.tsv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-results-${{ github.sha }}
          path: mutation-results/
          retention-days: 90
