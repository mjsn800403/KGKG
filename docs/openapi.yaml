# Generated from a reading of KG_backend/api/*.py views; edit by hand.
# Kept in sync with api/urls.py by api/test_openapi_routes.py.
openapi: 3.0.3
info:
  title: KGtechvault backend API
  version: 1.0.0
  description: 'Complete list of routes in KG_backend/api/urls.py (the catch-all api/* 404 route excepted). Enforced
    by KG_backend/api/test_openapi_routes.py: adding or removing a route without updating this file fails CI. Every
    operation carries x-kg-auth (public, portal, manager, analytics, root, admin, metrics, internal, portal_or_admin).
    The static KG_ADMIN_TOKEN (adminToken / bearer) is honoured only from loopback without proxy headers; over the
    internet admin calls use a platform-admin session token as Bearer.'
servers:
- url: /kg-api
tags:
- name: health
- name: auth
- name: chat
- name: flags
- name: content
- name: assistant
- name: parts
- name: team
- name: org
- name: company-requests
- name: events
- name: admin
- name: internal
paths:
  /api/health/:
    get:
      tags:
      - health
      summary: Liveness probe
      description: 'Returns {ok, db, rag_index, uptime_s}; 503 when the DB is unreachable. Auth: public.'
      x-kg-auth: public
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/metrics/:
    get:
      tags:
      - health
      summary: Prometheus metrics exposition
      description: 'KG_METRICS_TOKEN as Bearer or X-Metrics-Token header; 503 metrics_disabled when the env token
        is unset. nginx keeps it off the internet. Auth: metrics.'
      x-kg-auth: metrics
      security:
      - bearer: []
      - metricsToken: []
      responses:
        '200':
          description: Prometheus text format
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/admin/data-quality/:
    get:
      tags:
      - admin
      summary: Latest data-quality audit report
      description: 'Auth: admin.'
      x-kg-auth: admin
      security:
      - bearer: []
      - adminToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags:
      - admin
      summary: Start a background data-quality re-scan
      description: 'Auth: admin.'
      x-kg-auth: admin
      security:
      - bearer: []
      - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: boolean
                  description: must be true
                fix:
                  type: boolean
            example:
              refresh: true
              fix: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/admin/system/:
    get:
      tags:
      - admin
      summary: System snapshot + open alerts
      description: 'Auth: admin.'
      x-kg-auth: admin
      security:
      - bearer: []
      - adminToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags:
      - admin
      summary: Evaluate alert conditions now
      description: 'Auth: admin.'
      x-kg-auth: admin
      security:
      - bearer: []
      - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - check_alerts
              required:
              - action
            example:
              action: check_alerts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/admin/traffic/:
    get:
      tags:
      - admin
      summary: Website traffic from metric rollups
      description: 'Auth: admin.'
      x-kg-auth: admin
      security:
      - bearer: []
      - adminToken: []
      parameters:
      - name: range
        in: query
        required: false
        description: Days (1-90, default 7)
        schema:
          type: integer
        example: 7
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/admin/pipeline/:
    get:
      tags:
      - admin
      summary: Processing pipeline status
      description: 'Auth: admin.'
      x-kg-auth: admin
      security:
      - bearer: []
      - adminToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags:
      - admin
      summary: Pipeline action
      description: 'Auth: admin.'
      x-kg-auth: admin
      security:
      - bearer: []
      - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - start
                  - schedule
                  - resume
                  - cancel
                  - settings
                  - apply_power
                  - tis_start
                  - ps_start
                  - ps_build
                  - ps_stop
                  - tis_stop
                  - vnc_ticket
                  - tis_chrome
                  - scan_zips
                  - skip_zip
                  - requeue_zip
                at:
                  type: string
                  description: schedule time
                job_id:
                  type: integer
                zip_id:
                  type: integer
                url:
                  type: string
              required:
              - action
            example:
              action: start
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/admin/vehicle-specs/:
    get:
      tags:
      - admin
      summary: Vehicle spec coverage, or one car's spec
      description: 'Auth: admin.'
      x-kg-auth: admin
      security:
      - bearer: []
      - adminToken: []
      parameters:
      - name: car_id
        in: query
        required: false
        description: One car's full spec + provenance
        schema:
          type: integer
        example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/events/stream/:
    get:
      tags:
      - events
      summary: Server-Sent Events stream for the caller's scope
      description: 'Admin (admin session / env token) gets the admin audience, otherwise the portal user''s scope.
        Resume with Last-Event-ID header or ?after. Recycles after 300s. Auth: portal_or_admin.'
      x-kg-auth: portal_or_admin
      security:
      - portalCookie: []
      - bearer: []
      - adminToken: []
      parameters:
      - name: after
        in: query
        required: false
        description: Resume after this event id
        schema:
          type: integer
        example: 0
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
        example: '0'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/events/recent/:
    get:
      tags:
      - events
      summary: Recent events (REST catch-up)
      description: 'Auth: portal_or_admin.'
      x-kg-auth: portal_or_admin
      security:
      - portalCookie: []
      - bearer: []
      - adminToken: []
      parameters:
      - name: after
        in: query
        required: false
        description: Event id cursor
        schema:
          type: integer
        example: 0
      - name: limit
        in: query
        required: false
        description: 1-500, default 100
        schema:
          type: integer
        example: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/processing-snapshot/:
    get:
      tags:
      - admin
      summary: Pending-work processing snapshot
      description: 'Auth: admin.'
      x-kg-auth: admin
      security:
      - bearer: []
      - adminToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/admin/dashboard/:
    get:
      tags:
      - admin
      summary: Admin live-dashboard aggregate
      description: 'Auth: admin.'
      x-kg-auth: admin
      security:
      - bearer: []
      - adminToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/company/requests/:
    get:
      tags:
      - company-requests
      summary: List own company's requests
      description: 'Auth: manager.'
      x-kg-auth: manager
      security:
      - portalCookie: []
      - bearer: []
      parameters:
      - name: status
        in: query
        required: false
        description: Filter by status
        schema:
          type: string
        example: pending
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - company-requests
      summary: File a company request
      description: 'Methods other than GET/POST return 405. Auth: manager.'
      x-kg-auth: manager
      security:
      - portalCookie: []
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  description: request kind (default support)
                subject:
                  type: string
                  description: max 200 chars
                body:
                  type: string
                  description: max 4000 chars
                priority:
                  type: string
                  description: default normal
                payload:
                  type: object
                  description: 'whitelisted per kind: vehicle_access {car_ids[], documents[]}, seats {seats}'
              required:
              - subject
            example:
              kind: support
              subject: Need access to Corolla manuals
              body: Please add the vehicle
              priority: normal
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/company/requests/{req_id}/:
    parameters:
    - $ref: '#/components/parameters/req_id'
    get:
      tags:
      - company-requests
      summary: Company request detail
      description: 'Auth: manager.'
      x-kg-auth: manager
      security:
      - portalCookie: []
      - bearer: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - company-requests
      summary: Cancel own open request
      description: 'Auth: manager.'
      x-kg-auth: manager
      security:
      - portalCookie: []
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cancel:
                  type: boolean
                  description: must be true
              required:
              - cancel
            example:
              cancel: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/company-requests/:
    get:
      tags:
      - admin
      summary: Company-request inbox
      description: 'Auth: admin.'
      x-kg-auth: admin
      security:
      - bearer: []
      - adminToken: []
      parameters:
      - name: status
        in: query
        required: false
        description: Filter by status
        schema:
          type: string
        example: pending
      - name: company_id
        in: query
        required: false
        description: Filter by company
        schema:
          type: integer
        example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/admin/company-requests/{req_id}/:
    parameters:
    - $ref: '#/components/parameters/req_id'
    post:
      tags:
      - admin
      summary: Update a company request (status / note / handler)
      description: 'Only POST (other methods 405 after the 404 lookup). Auth: admin.'
      x-kg-auth: admin
      security:
      - bearer: []
      - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                admin_note:
                  type: string
                handled_by:
                  type: string
            example:
              status: in_progress
              admin_note: on it
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/auth/login/:
    post:
      tags:
      - auth
      summary: Portal login
      description: 'username may be a username or email. Returns {token, user} and sets the kg_portal_token cookie,
        or {otp_required, otp_session} when SMS 2FA is on. Auth: public. Rate limit: 15/60s per IP per worker (429
        + Retry-After).'
      x-kg-auth: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                turnstile_token:
                  type: string
                  description: Cloudflare Turnstile token when enabled
              required:
              - username
              - password
            example:
              username: x
              password: x
              turnstile_token: x
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/auth/logout/:
    post:
      tags:
      - auth
      summary: Logout (delete presented session token, clear cookie)
      description: 'Auth: portal (optional).'
      x-kg-auth: portal (optional)
      security:
      - portalCookie: []
      - bearer: []
      - {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/auth/me/:
    get:
      tags:
      - auth
      summary: Current portal user
      description: 'Auth: portal.'
      x-kg-auth: portal
      security:
      - portalCookie: []
      - bearer: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/chat-log/:
    post:
      tags:
      - chat
      summary: Record one assistant exchange
      description: 'Auth: portal.'
      x-kg-auth: portal
      security:
      - portalCookie: []
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                answer:
                  type: string
                session_id:
                  type: string
                mode:
                  type: string
                grounded:
                  type: boolean
                degraded:
                  type: boolean
                vehicle:
                  type: string
                sources:
                  type: array
                  items: {}
                latency_ms:
                  type: integer
                llm_latency_ms:
                  type: integer
                input_tokens:
                  type: integer
                output_tokens:
                  type: integer
                llm_cost:
                  type: number
                llm_usage:
                  type: object
                client_key:
                  type: string
                flags:
                  type: object
              required:
              - question
            example:
              question: engine oil capacity
              answer: 4.2 L
              client_key: x
      responses:
        '200':
          description: Created {id}
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/auth/flags/:
    get:
      tags:
      - flags
      summary: A/B flag arms for the current user
      description: 'Auth: portal.'
      x-kg-auth: portal
      security:
      - portalCookie: []
      - bearer: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/flags/:
    get:
      tags:
      - admin
      summary: List feature flags
      description: 'Auth: admin.'
      x-kg-auth: admin
      security:
      - bearer: []
      - adminToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags:
      - admin
      summary: Create / update / delete a feature flag
      description: 'Auth: admin.'
      x-kg-auth: admin
      security:
      - bearer: []
      - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: ^[a-z][a-z0-9_]*$
                delete:
                  type: boolean
                description:
                  type: string
                enabled:
                  type: boolean
                rollout_pct:
                  type: integer
                force_on:
                  type: array
                  items:
                    type: integer
                force_off:
                  type: array
                  items:
                    type: integer
              required:
              - key
            example:
              key: mq_translate
              enabled: true
              rollout_pct: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/admin/flags/{key}/results/:
    parameters:
    - $ref: '#/components/parameters/key'
    get:
      tags:
      - admin
      summary: A/B results for one flag
      description: 'Auth: admin.'
      x-kg-auth: admin
      security:
      - bearer: []
      - adminToken: []
      parameters:
      - name: days
        in: query
        required: false
        description: 1-365, default 30
        schema:
          type: integer
        example: 30
      - name: exclude_companies
        in: query
        required: false
        description: Comma-separated company ids
        schema:
          type: string
        example: 1,2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/auth/chat-feedback/:
    post:
      tags:
      - chat
      summary: Vote / copy / source-click signal on own exchange
      description: 'Auth: portal.'
      x-kg-auth: portal
      security:
      - portalCookie: []
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: client_key of the logged exchange
                kind:
                  type: string
                  enum:
                  - vote
                  - copy
                  - source
                verdict:
                  type: integer
                reason:
                  type: string
                comment:
                  type: string
              required:
              - key
              - kind
            example:
              key: x
              kind: vote
              verdict: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/admin/insights/assistant/:
    get:
      tags:
      - admin
      summary: Assistant behaviour insights / one conversation
      description: 'Auth: admin.'
      x-kg-auth: admin
      security:
      - bearer: []
      - adminToken: []
      parameters:
      - name: session
        in: query
        required: false
        description: Conversation session id
        schema:
          type: string
        example: x
      - name: log
        in: query
        required: false
        description: ChatLog id
        schema:
          type: integer
        example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/team/chat-logs/:
    get:
      tags:
      - team
      summary: Chat logs of users in the viewer's org reach
      description: 'Auth: analytics.'
      x-kg-auth: analytics
      security:
      - portalCookie: []
      - bearer: []
      parameters:
      - name: q
        in: query
        required: false
        description: Text search
        schema:
          type: string
