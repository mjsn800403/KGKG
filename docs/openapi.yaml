components:
  securitySchemes:
    portalCookie:
      type: apiKey
      in: cookie
      name: kg_portal_token
      description: Portal session token as HttpOnly cookie (SSR / browser).
    bearer:
      type: http
      scheme: bearer
      description: Portal AuthToken, platform-admin session token, or (metrics) KG_METRICS_TOKEN.
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Platform-admin session token or KG_ADMIN_TOKEN (loopback only).
    metricsToken:
      type: apiKey
      in: header
      name: X-Metrics-Token
    vncTicket:
      type: apiKey
