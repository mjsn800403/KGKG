# Documentation ownership and review
#
# Why this file exists: the 2026-10-30 evaluation found no formal knowledge
# transfer mechanism. The content in docs/ was never the problem — ownership
# was. It was assigned by ROLE rather than to a person, nothing recorded when
# a document was last confirmed correct, and nothing noticed when one rotted.
#
# `ops/governance/check_docs_freshness.py` enforces this file in CI: every
# .md under docs/ needs an entry, every entry needs a named owner, and a
# document past `reviewed + review_days` fails the build. The staleness rule
# is the same one the product applies to knowledge-base articles, so the
# repository and the product never disagree about what "stale" means.
#
# HOW TO USE IT
#   * Reviewed a document and it is still correct? Move `reviewed` to today.
#     That is the whole ritual — it is meant to be cheap enough to actually do.
#   * Changed a document? Move `reviewed` too; you have just confirmed it.
#   * New document? Add an entry in the same commit, or CI will say so.
#
# PROVISIONAL OWNERS — PLEASE CORRECT
# These were SEEDED from git history (the last human author of each file), not
# agreed with anyone. They are a starting point that makes the gate real, not a
# record of who accepted the duty. Replace them with the people who actually
# own each area. `reviewed` is seeded with the date the file was last changed,
# which is the best available proxy and is NOT the same as a review.

