# Umami — cookieless page-view + funnel analytics for kgtechvault.com.
# Dashboard: loopback only (ssh -L 3002:127.0.0.1:3002). nginx publishes ONLY
# the tracker script and the collect endpoint under /stats/ (see kgkg site).
services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.15.1
    env_file: ./umami.env
    environment:
      DATABASE_TYPE: postgresql
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      TRACKER_SCRIPT_NAME: kgs.js
      CLIENT_IP_HEADER: cf-connecting-ip
    ports: ["127.0.0.1:3002:3000"]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file: ./umami.env
    volumes:
      - umami-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

volumes:
  umami-db:
