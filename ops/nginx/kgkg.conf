# Next.js (src/proxy.ts) sends a per-request nonce CSP for pages; every other
# response (API, static, errors) falls back to this static policy.
map $upstream_http_content_security_policy $kg_csp {
    ""      "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://cloudflareinsights.com https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    default "";
}

# www -> apex, one canonical host.
# ---------------------------------------------------------------------------
# Metrics scrape listener (Prometheus in the observability compose network).
#
# Not on :80, because ufw admits 80/443 only from Cloudflare and that rule is
# worth keeping. It binds every interface rather than the docker gateway alone
# so nginx cannot fail to start when the bridge does not exist yet (boot
# order); ufw restricts the port to 172.19.0.0/16, this block allow-lists the
# same range, and the endpoint still requires KG_METRICS_TOKEN.
server {
    listen 8081;
    server_name _;
    access_log off;

    location = /kg-metrics {
        allow 172.19.0.0/16;
        allow 127.0.0.1;
        deny all;
        # The shared backend snippet is deliberately NOT included here: it
        # sets Host to $host, and a second proxy_set_header does not replace
        # that one, it appends — Django then sees "127.0.0.1,127.0.0.1" and
        # answers 400. A scrape needs none of the snippet anyway.
        proxy_pass http://127.0.0.1:8000/api/metrics/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Connection "";
        proxy_read_timeout 20s;
    }

    # Nothing else is served here, on any path.
    location / { deny all; }
}

server {
    listen 80;
    listen 443 ssl http2;
    ssl_certificate     /etc/nginx/cloudflare/origin.pem;
    ssl_certificate_key /etc/nginx/cloudflare/origin.key;
    server_name www.kgtechvault.com;
    server_tokens off;
    return 301 https://kgtechvault.com$request_uri;
}

server {
    listen 80 default_server;
    listen 443 ssl http2 default_server;
    ssl_certificate     /etc/nginx/cloudflare/origin.pem;
    ssl_certificate_key /etc/nginx/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    server_name kgtechvault.com 103.75.197.155;

    client_max_body_size 50m;

    # Slowloris guards: a client that dribbles a request or refuses to read the
    # response should not be able to hold a worker slot indefinitely.
    client_body_timeout   30s;
    client_header_timeout 30s;
    send_timeout          60s;

    # Don't advertise the exact nginx build to anyone fingerprinting the host.
    server_tokens off;

    # `limit_req_log_level warn` is pointless unless the log itself accepts warn
    # — nginx's default error_log level is `error`, which silently swallows
    # every rate-limit rejection. The fail2ban jail below reads these lines, so
    # without this the jail would never see a single hit.
    error_log /var/log/nginx/error.log warn;

    # Security headers applied site-wide. `always` matters — without it these
    # are dropped on error responses, which is exactly when a reflected payload
    # would be rendered.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy $kg_csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Concurrent-connection ceiling for ordinary traffic (SSE has its own).
    limit_conn kg_conn 60;

    # ---------------------------------------------------------------------
    # WAF: ModSecurity 3 + OWASP CRS 3.3.5
    # ---------------------------------------------------------------------
    # Enabled site-wide, then switched off in the two static locations below
    # where it would burn CPU inspecting immutable image bytes for nothing.
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity/main.conf;

    # Compress API/JSON/text responses (manual pages are large HTML-in-JSON).
    gzip on;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;

    # ---------------------------------------------------------------------
    # Static / media — high volume, low risk
    # ---------------------------------------------------------------------

    # Per-car manual images served straight from disk — no Python in the path.
    # Immutable crawl artifacts: cache hard.
    location = /_kg_media_auth {
        internal;
        modsecurity off;
        proxy_pass http://127.0.0.1:8000/api/media-auth/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_cache kg_mediaauth;
        proxy_cache_key "$cookie_kg_portal_token|$http_authorization|$kg_media_car";
        proxy_cache_valid 204 401 403 60s;
    }

    # TIS browser screen (noVNC -> x11vnc on :99) for logging in to TIS with
    # the OTP from the admin dashboard. VNC has no password of its own, so the
    # admin-only signed cookie checked here (api/vncauth.py) is the whole gate.
    location = /_kg_vnc_auth {
        internal;
        modsecurity off;
        proxy_pass http://127.0.0.1:8000/api/vnc-auth/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }

    # Grafana log dashboards embedded in the super-admin panel. Same gate as
    # /kg-vnc/: an admin-only signed cookie (api/grafanaauth.py) checked on
    # every request; only then is Grafana's auth-proxy header set (overwriting
    # anything the client sent).
    location = /_kg_grafana_auth {
        internal;
        modsecurity off;
        proxy_pass http://127.0.0.1:8000/api/grafana-auth/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }

    location ^~ /grafana/ {
        auth_request /_kg_grafana_auth;
        modsecurity off;
        limit_req zone=kg_admin burst=80 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-WEBAUTH-USER "admin";
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 300s;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    }

    location ^~ /kg-vnc/ {
        auth_request /_kg_vnc_auth;
        modsecurity off;
        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    }

    location ^~ /kg-api/media/ {
        # The normalized path (dot-segments resolved, slashes merged) for the
        # auth cache key; see conf.d/kgkg-mediaauth.conf.
        set $kg_media_path $uri;
        limit_req zone=kg_static burst=300 nodelay;
        # Static image bytes off disk: nothing here is user input, and a manual
        # page pulls dozens at once. Inspecting them is pure overhead.
        modsecurity off;
        alias "/opt/KGKG/KG_backend/static_warehouse/";
        # Paid content: login (+ car access) required, and "private" so
        # Cloudflare never caches a copy it could hand to anyone.
        auth_request /_kg_media_auth;
        add_header Cache-Control "private, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/index.html /index.html =404;
    }

    # Next.js build output: hashed filenames, dozens per page load.
    # ---------------------------------------------------------------------
    # Umami analytics (/opt/umami). Only the tracker script and the collect
    # endpoint are public; the dashboard stays on loopback (ssh -L 3002).
    # ---------------------------------------------------------------------
    location = /stats/kgs.js {
        limit_req zone=kg_static burst=50 nodelay;
        proxy_pass http://127.0.0.1:3002/kgs.js;
        proxy_set_header Host $host;
        expires 1h;
    }
    location = /stats/api/send {
        limit_req zone=kg_api burst=50 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3002/api/send;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header User-Agent $http_user_agent;
    }

    location ^~ /_next/static/ {
        limit_req zone=kg_static burst=300 nodelay;
        # Hashed build artefacts — same reasoning as media above.
        modsecurity off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------------
    # Credential endpoints — tightest limits on the box
    # ---------------------------------------------------------------------
    # burst=10 lets a fat-fingered user retry a few times immediately; the
    # 30r/m refill is what makes a password-spraying run pointless.

    location = /kg-api/api/auth/login/ {
        limit_req zone=kg_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000/api/auth/login/;
        include /etc/nginx/snippets/kgkg-backend-proxy.conf;
    }

    location = /kg-api/api/auth/verify-otp/ {
        limit_req zone=kg_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000/api/auth/verify-otp/;
        include /etc/nginx/snippets/kgkg-backend-proxy.conf;
    }

    location = /kg-api/api/auth/resend-otp/ {
        limit_req zone=kg_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000/api/auth/resend-otp/;
        include /etc/nginx/snippets/kgkg-backend-proxy.conf;
    }

    location = /kg-api/api/auth/recover/start/ {
        limit_req zone=kg_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000/api/auth/recover/start/;
        include /etc/nginx/snippets/kgkg-backend-proxy.conf;
    }

    location = /kg-api/api/auth/recover/reset/ {
        limit_req zone=kg_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000/api/auth/recover/reset/;
        include /etc/nginx/snippets/kgkg-backend-proxy.conf;
    }

    location = /kg-api/api/admin/login/ {
        limit_req zone=kg_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000/api/admin/login/;
        include /etc/nginx/snippets/kgkg-backend-proxy.conf;
    }

    # Single-use invite links: same brute-force shape (guessing a token).
    location ^~ /kg-api/api/invite/ {
        limit_req zone=kg_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000/api/invite/;
        include /etc/nginx/snippets/kgkg-backend-proxy.conf;
    }

    # ---------------------------------------------------------------------
    # Admin surface
    # ---------------------------------------------------------------------
    # Note: the admin *login* location above is an exact match, so it keeps its
    # tighter kg_auth limit rather than being swallowed by this prefix.
    location ^~ /kg-api/api/admin/ {
        limit_req zone=kg_admin burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000/api/admin/;
        include /etc/nginx/snippets/kgkg-backend-proxy.conf;
    }

    # ---------------------------------------------------------------------
    # Server-Sent Events — long-lived, must not be request-rate limited
    # ---------------------------------------------------------------------
    # One request that stays open for an hour. A request-rate limit is
    # meaningless here; what matters is how many sockets one client may hold.
    # Must precede location /kg-api/.
    location = /kg-api/api/events/stream/ {
        limit_conn kg_sse 8;
        proxy_pass http://127.0.0.1:8000/api/events/stream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # ---------------------------------------------------------------------

    # ---------------------------------------------------------------------
    # Yaris package download portal — static, temporary
    # ---------------------------------------------------------------------
    location ^~ /downloads/ {
        limit_req zone=kg_static burst=300 nodelay;
        modsecurity off;
        alias /opt/KGKG/downloads/;
        index index.html;
        autoindex off;
        try_files $uri $uri/index.html /index.html =404;
    }

    # The scrape reaches the metrics endpoint through the dedicated :8081
    # listener at the top of this file, not through this server.

    # Exact match, so it wins over the /kg-api/ prefix: internal state is not
    # something the internet gets to ask for, token or no token.
    location = /kg-api/api/metrics/ { deny all; }

    # Django backend (API + catalog) via same origin — port 8000 not exposed.
    # ---------------------------------------------------------------------
    location /kg-api/ {
        limit_req zone=kg_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:8000/;
        include /etc/nginx/snippets/kgkg-backend-proxy.conf;
    }

    # ---------------------------------------------------------------------
    # The paid AI assistant (Next.js route -> Metis, billed per call)
    # ---------------------------------------------------------------------
    location ^~ /api/chat {
        limit_req zone=kg_chat burst=15 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # ---------------------------------------------------------------------
    # Everything else -> Next.js
    # ---------------------------------------------------------------------
    location / {
        limit_req zone=kg_general burst=120 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
