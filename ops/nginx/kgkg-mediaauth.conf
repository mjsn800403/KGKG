# Media auth cache (see KG_backend/api/mediaauth.py): one backend check per
# token + car folder per minute instead of one per image.
# Installed as /etc/nginx/conf.d/kgkg-mediaauth.conf.
proxy_cache_path /var/cache/nginx/kg_mediaauth levels=1 keys_zone=kg_mediaauth:5m max_size=50m inactive=10m;
# The cache key must name the folder nginx SERVES, not the one the client
# typed: /kg-api/media/_parts_assets/../<car>/x.png is served from <car>.
# Keying on the raw $request_uri cached a 204 for "_parts_assets" and handed
# it to a dot-segment request for any car. $kg_media_path is set to the
# normalized $uri in the media location (sites-available/kgkg); auth_request
# subrequests share the parent's variables, so it is visible here, whereas
# $uri itself would read /_kg_media_auth inside the subrequest.
map $kg_media_path $kg_media_car {
    ~^/kg-api/media/(?<car>[^/]+)/ $car;
    default "";
}
