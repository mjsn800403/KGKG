# ModSecurity audit log. Verbose by nature (full request headers per hit), so
# it rotates daily and is kept short — the WAF decision is also summarised in
# nginx error.log, which is what fail2ban actually reads.
/var/log/nginx/modsec_audit.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    create 0640 www-data adm
    dateext
    postrotate
        [ -f /run/nginx.pid ] && kill -USR1 $(cat /run/nginx.pid) || true
    endscript
}
