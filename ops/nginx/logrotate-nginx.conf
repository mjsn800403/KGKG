# access.log and error.log are listed explicitly rather than globbed.
# /var/log/nginx/*.log also matched modsec_audit.log, which
# /etc/logrotate.d/modsecurity declares with its own retention — and a
# duplicate entry makes logrotate skip this whole file, so nginx logs stopped
# rotating altogether (failing since 2026-10-27 00:00 until this fix).
/var/log/nginx/access.log
/var/log/nginx/error.log {
	daily
	missingok
	rotate 14
	compress
	delaycompress
	notifempty
	create 0640 www-data adm
	sharedscripts
	prerotate
		if [ -d /etc/logrotate.d/httpd-prerotate ]; then \
			run-parts /etc/logrotate.d/httpd-prerotate; \
		fi \
	endscript
	postrotate
		invoke-rc.d nginx rotate >/dev/null 2>&1
	endscript
}
