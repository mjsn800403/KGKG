# /etc/nginx/conf.d/kgkg-limits.conf
#
# Edge rate limiting. Until now the only limiter was the in-process one in
# api/ratelimit.py, which has two structural gaps this layer closes:
#
#   1. it lives inside gunicorn, so a request only gets counted after Django
#      has already been woken up — a flood still costs us workers, DB handles
#      and (for /api/chat) real money;
#   2. it counts per worker. With `--workers 3` the effective limit is 3x what
#      the decorator says. nginx counts once, in shared memory, for everyone.
#
# The two layers are complementary and both stay: nginx is the blunt volumetric
# guard, Django keeps the per-endpoint semantics.

# ---------------------------------------------------------------------------
# Who gets counted
# ---------------------------------------------------------------------------
# The Next.js server renders pages by fetching NEXT_PUBLIC_API_BASE, which is
# the PUBLIC url — so every server-side render arrives back at nginx from this
# machine's own address. Counting those would put the entire site's SSR traffic
# in one bucket and throttle all users at once. Loopback and self are therefore
# exempt; the real client is still limited on the page request that triggered
# the render.
geo $kg_limit_exempt {
    default            0;
    127.0.0.1/32       1;
    ::1/128            1;
    103.75.197.155/32  1;
}

# An empty key disables the limit for that request (documented nginx behaviour).
map $kg_limit_exempt $kg_client {
    0  $binary_remote_addr;
    1  "";
}

# ---------------------------------------------------------------------------
# Zones
# ---------------------------------------------------------------------------
# Sizing note: customers are companies whose staff sit behind a single NAT
# gateway, so one "IP" can legitimately be dozens of people. Every limit below
# is set for a busy office, not a single browser — the goal is to stop scripted
# abuse without ever throttling a real reading session.
#
# 10m of shared memory tracks roughly 160k distinct addresses per zone.

# Whole-site default: page navigations, XHR, everything not matched below.
limit_req_zone $kg_client zone=kg_general:10m rate=30r/s;

# Build assets and manual images. One manual page pulls dozens of figures plus
# the Next.js chunk set, so this has to be an order of magnitude looser.
limit_req_zone $kg_client zone=kg_static:10m rate=100r/s;

# Django API surface.
limit_req_zone $kg_client zone=kg_api:10m rate=20r/s;

# Credential endpoints. Tight on purpose: this is the anti-brute-force limit,
# and nobody types a password 30 times a minute.
limit_req_zone $kg_client zone=kg_auth:10m rate=30r/m;

# The AI assistant proxies to Metis, which bills per call. Cheapest possible
# place to stop a runaway loop is before it reaches the Node process.
limit_req_zone $kg_client zone=kg_chat:10m rate=60r/m;

# Admin surface — small, privileged, low legitimate volume.
limit_req_zone $kg_client zone=kg_admin:10m rate=20r/s;

# Concurrent connections. Guards slowloris-style socket exhaustion, which a
# request-rate limit does nothing about.
limit_conn_zone $kg_client zone=kg_conn:10m;

# Server-Sent Events hold a socket open for up to an hour by design, so they
# get their own allowance rather than eating the general connection budget.
limit_conn_zone $kg_client zone=kg_sse:10m;

# ---------------------------------------------------------------------------
# Behaviour when a limit trips
# ---------------------------------------------------------------------------
# 429 rather than nginx's default 503: it's the correct code, and it tells the
# frontend (and any well-behaved crawler) to back off rather than retry hard.
limit_req_status  429;
limit_conn_status 429;
# `warn` puts every rejection in error.log, which is what the fail2ban jail and
# the WAF audit review both read.
limit_req_log_level warn;
