# KGKG log search + dashboards: Loki (store), Alloy (shipper), Grafana (UI).
# Everything binds to loopback only. Reach Grafana through an SSH tunnel:
#   ssh -L 3001:127.0.0.1:3001 root@<vps>   then open http://localhost:3001
# Alerting stays in the Django check_alerts engine (api/alert_rules.py); this
# stack is for searching and charting logs.
services:
  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports: ["127.0.0.1:3100:3100"]
    mem_limit: 1g
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.7.5
    command: run --server.http.listen-addr=127.0.0.1:12345 --storage.path=/var/lib/alloy /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/kgkg:/var/log/kgkg:ro
      - /var/log/nginx:/var/log/nginx:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy
    depends_on: [loki]
    mem_limit: 512m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    env_file: ./grafana.env
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [loki]
    mem_limit: 512m
    restart: unless-stopped

volumes:
  loki-data:
  alloy-data:
  grafana-data:
