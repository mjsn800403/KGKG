# KGKG log search + dashboards: Loki (store), Alloy (shipper), Grafana (UI).
# Everything binds to loopback only. Reach Grafana through an SSH tunnel:
#   ssh -L 3001:127.0.0.1:3001 root@<vps>   then open http://localhost:3001
# Alerting stays in the Django check_alerts engine (api/alert_rules.py); this
# stack is for searching and charting logs.
services:
  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports: ["127.0.0.1:3100:3100"]
    mem_limit: 1g
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.7.5
    command: run --server.http.listen-addr=127.0.0.1:12345 --storage.path=/var/lib/alloy /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/kgkg:/var/log/kgkg:ro
      - /var/log/nginx:/var/log/nginx:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy
    depends_on: [loki]
    mem_limit: 512m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    env_file: ./grafana.env
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Embedded in the super-admin panel at https://kgtechvault.com/grafana/.
      # nginx admits a request only with a valid admin ticket cookie
      # (api/grafanaauth.py) and then sets X-WEBAUTH-USER, overwriting anything
      # the client sent; the port itself is loopback-only.
      GF_SERVER_ROOT_URL: https://kgtechvault.com/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "false"
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "false"
      GF_INSTALL_PLUGINS: frser-sqlite-datasource 3.5.0
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
      - ./bizdb:/var/lib/bizdb:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [loki]
    mem_limit: 512m
    restart: unless-stopped

  # Server metrics: host (node-exporter) + per-container / per-systemd-unit
  # (cAdvisor). node-exporter uses the host network so NIC stats are real; it
  # binds only to this compose network's gateway, never a public address.
  prometheus:
    image: prom/prometheus:v3.2.1
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=30d]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]  # alert_rules._infra
    mem_limit: 1g
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.0
    command: [--path.rootfs=/host, --web.listen-address=172.19.0.1:9100]
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 128m
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    command: [--docker_only=false, --housekeeping_interval=30s, --store_container_labels=false]
    privileged: true
    devices: [/dev/kmsg]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 512m
    restart: unless-stopped

  # Uptime / latency / TLS-expiry probes (scraped by prometheus, job probe*).
  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes:
      - ./blackbox.yml:/etc/blackbox/blackbox.yml:ro
    mem_limit: 128m
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
