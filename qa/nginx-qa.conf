# QA stack reverse proxy (qa/stack.sh). Mirrors the routing and security
# headers of ops/nginx/kgkg.conf so the browser, load and DAST suites see the
# same single origin production serves, with two deliberate differences:
#   * no ModSecurity/CRS WAF and no limit_req: DAST must find what the
#     application itself lets through, and load tests must measure the
#     application's capacity, not nginx's rate limiter
#   * plain HTTP on loopback :8130 (TLS terminates at Cloudflare/nginx in prod)
map $upstream_http_content_security_policy $kg_csp {
    ""      "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://cloudflareinsights.com https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    default "";
}

# Media auth exactly as production wires it (ops/nginx/kgkg-mediaauth.conf).
proxy_cache_path /tmp/kg_mediaauth levels=1 keys_zone=kg_mediaauth:5m max_size=50m inactive=10m;
map $kg_media_path $kg_media_car {
    ~^/kg-api/media/(?<car>[^/]+)/ $car;
    default "";
}

server {
    listen 127.0.0.1:__PROXY_PORT__;
    server_name _;
    server_tokens off;
    client_max_body_size 50m;
    access_log /var/log/nginx/qa-access.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy $kg_csp always;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /kg-api/api/metrics/ { deny all; }

    location = /_kg_media_auth {
        internal;
        proxy_pass http://127.0.0.1:__BE_PORT__/api/media-auth/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_cache kg_mediaauth;
        proxy_cache_key "$cookie_kg_portal_token|$http_authorization|$kg_media_car";
        proxy_cache_valid 204 401 403 60s;
    }

    location ^~ /kg-api/media/ {
        set $kg_media_path $uri;
        alias "/static_warehouse/";
        auth_request /_kg_media_auth;
        add_header Cache-Control "private, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/index.html /index.html =404;
    }

    location = /kg-api/api/events/stream/ {
        proxy_pass http://127.0.0.1:__BE_PORT__/api/events/stream/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /kg-api/ {
        proxy_pass http://127.0.0.1:__BE_PORT__/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:__FE_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }
}
